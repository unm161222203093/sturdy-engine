<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Jeep Alarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-4xl font-bold mb-4">Police Jeep Alarm</h1>
        <button id="alarmButton" class="bg-blue-500 text-white px-6 py-3 rounded-full text-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            <i class="fas fa-bell"></i> Play Alarm
        </button>
        <button id="stopButton" class="bg-red-500 text-white px-6 py-3 rounded-full text-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 mt-4">
            <i class="fas fa-stop"></i> Stop Alarm
        </button>
        
        <audio id="alarmSound" src="C:\Users\xik\.vscode\keerthana\html\police-siren-sound-effect-240674.mp3"></audio>
    </div>

    <script>
        document.getElementById('alarmButton').addEventListener('click', function() {
            var alarmSound = document.getElementById('alarmSound');
            alarmSound.play();
        });

        document.getElementById('stopButton').addEventListener('click', function() {
            var alarmSound = document.getElementById('alarmSound');
            alarmSound.pause();
            alarmSound.currentTime = 0;
        });
    </script>
</body>
