<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Location via WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Share Your Location</h1>
    <button id="shareLocationBtn">Share Location via WhatsApp</button>
    <p id="status"></p>

    <script>
        document.getElementById('shareLocationBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const message = `I'm here: https://www.google.com/maps/@${latitude},${longitude},15z`;
                    const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
                    
                    // Open WhatsApp with the message
                    window.open(whatsappUrl, '_blank');
                }, function(error) {
                    document.getElementById('status').innerText = 'Unable to retrieve your location. Please allow location access.';
                });
            } else {
                document.getElementById('status').innerText = 'Geolocation is not supported by this browser.';
            }
        });
    </script>
</body>
</html>
